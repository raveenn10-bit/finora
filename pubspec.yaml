name: finora
description: Finora – smart personal finance app with biometric protection.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Auth
  local_auth: ^2.3.0

  # Secure storage for PIN hash & session token
  flutter_secure_storage: ^9.2.4

  # State management
  flutter_riverpod: ^2.5.1

  # Google Fonts (Plus Jakarta Sans — clean fintech type)
  google_fonts: ^6.2.1

  # SVG icons
  flutter_svg: ^2.0.10+1

  # SHA-256 PIN hashing (used by pin_service.dart)
  crypto: ^3.0.3

  # SQLite local database
  sqflite: ^2.3.3+1

  # Path manipulation (used by database_helper.dart)
  path: ^1.9.0

  # Path provider (app documents directory for DB)
  path_provider: ^2.1.5

  # Internationalization & date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/logo.png"
  adaptive_icon_background: "#0A0E21"
  adaptive_icon_foreground: "assets/branding/logo.png"
  min_sdk_android: 23
